<html lang="en">

<title>Thatch GTM Performance &amp; Metric Trust Board (concept demo)</title>

<style>
:root{
  --primary:#F31616; --text:#0A0A0A; --muted:#6B6F76; --bg:#F7F7F7; --card:#FFFFFF; --border:#E6E6E6;
  --warn:#F5A524; --err:#E5484D; --ok:#1F9D55; --grey-out:#B9BCC1;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;overflow-x:hidden;min-width:1280px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:40}
.appbar{height:56px;background:#fff;border-bottom:2px solid var(--primary);display:flex;align-items:center;padding:0 24px;gap:16px}
.brand{display:flex;align-items:center;gap:8px;flex:none}
.brand img{height:26px;width:auto;display:block}
.brand .word{font-weight:700;font-size:18px;letter-spacing:-.01em}
.divider{width:1px;height:24px;background:var(--border);flex:none}
.prod{font-size:13px;color:var(--muted);flex:none;white-space:nowrap}
.tabs{display:flex;align-items:stretch;height:56px;margin-left:8px;flex:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:0 12px;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:-2px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-current="page"]{color:var(--text);font-weight:600;border-bottom-color:var(--primary)}
.viewing{margin-left:auto;font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice{height:32px;background:#FFF8EA;border-bottom:1px solid #F1DFB8;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px}
.notice b{font-weight:600}
.linkbtn{background:none;border:0;padding:0;font-size:12px;text-decoration:underline;text-decoration-color:var(--primary);text-underline-offset:3px}
main{max-width:1440px;margin:0 auto;padding:20px 24px 16px}
footer{max-width:1440px;margin:0 auto;padding:16px 24px 28px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
h1{font-size:20px;line-height:28px;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
h3{font-size:13px;margin:0 0 8px;font-weight:600}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px}
.card.tight{padding:0}
.grid{display:grid;gap:16px}
.pill{display:inline-block;font-size:10px;line-height:14px;text-transform:uppercase;letter-spacing:.04em;border:1px solid #C9CCD1;color:var(--muted);border-radius:999px;padding:0 6px;font-weight:500;vertical-align:middle;white-space:nowrap}
.muted{color:var(--muted)}
.trunc{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* trust badge */
.tb{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:700;border:0;padding:0;vertical-align:middle;margin-left:6px;flex:none}
.tb:focus-visible,.tab:focus-visible,.chip:focus-visible,button:focus-visible,a:focus-visible,tr:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.tb-A{background:#0A0A0A;color:#fff}
.tb-B{background:#6B6F76;color:#fff}
.tb-C{background:var(--warn);color:#0A0A0A}
.tb.lg{width:28px;height:28px;font-size:14px;border-radius:7px}
.trusted-only .val[data-grade="C"]{color:var(--grey-out)!important;opacity:.6}
.trusted-only .val[data-grade="C"] *{color:inherit!important}
/* toggle */
.switch{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;font-weight:500}
.switch .track{width:34px;height:20px;border-radius:999px;background:#C9CCD1;position:relative;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"] .track{background:var(--text)}
.switch[aria-checked="true"] .track::after{left:16px}
/* callout */
.callout{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;padding:14px 18px;margin-bottom:14px}
.callout .txt{flex:1;font-size:15px;line-height:22px}
.callout .txt b{font-weight:600}
.btn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#C9CCD1;background:#FAFAFA}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.primary:hover{background:#D90F0F}
.btn[disabled]{opacity:.5;cursor:default}
/* chips */
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chips .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--text);color:#fff;border-color:var(--text)}
.sep{width:1px;height:20px;background:var(--border);margin:0 6px}
/* tables */
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
th{position:sticky;top:90px;z-index:5;background:#fff;text-align:left;font-size:12px;font-weight:600;color:var(--muted);height:48px;padding:0 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{height:48px;padding:0 14px;border-bottom:1px solid var(--border);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:last-child td{border-bottom:0}
th.num,td.num{text-align:right}
tr.row{cursor:pointer}
tr.row:hover td{background:#FAFAFA}
td .cellwrap{display:flex;align-items:center;justify-content:flex-end}
td.name strong{font-weight:600}
th a,.mlink{text-decoration:underline;text-decoration-color:var(--primary);text-underline-offset:3px;text-decoration-thickness:1px;cursor:pointer;color:inherit}
th a{color:var(--muted)}
th a:hover,.mlink:hover{color:var(--text)}
.chev{color:var(--muted);font-size:12px}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;min-height:132px}
.kpi .k{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:center}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:6px 0 4px;display:flex;align-items:center}
.kpi .rec{font-size:12px;color:var(--muted)}
.rec .ok{color:var(--ok);font-weight:700}.rec .no{color:var(--err);font-weight:700}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px}
.rcard h3{font-size:14px;margin:0}
.rcard .n{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rcard p{margin:0;font-size:13px}
.rcard .trade{color:var(--muted);font-size:12.5px}
.boundary{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 18px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-top:16px}
.boundary .dot{width:8px;height:8px;border-radius:50%;background:var(--text);margin-top:6px;flex:none}
/* drawer/modal */
.backdrop{position:fixed;inset:0;background:rgba(10,10,10,.28);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:620px;max-width:100vw;background:#fff;z-index:90;box-shadow:-8px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column}
.drawer.wide{width:780px}
.drawer header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.drawer header h2{margin:0;font-size:17px;flex:1;min-width:0}
.drawer .body{padding:20px 24px 32px;overflow-y:auto;flex:1}
.drawer section{margin-bottom:22px}
.iconbtn{border:1px solid var(--border);background:#fff;border-radius:7px;width:32px;height:32px;font-size:16px;line-height:1}
.modal{position:fixed;left:50%;top:80px;transform:translateX(-50%);width:600px;max-height:calc(100vh - 140px);overflow:auto;background:#fff;border-radius:12px;z-index:110;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:22px 24px}
.backdrop.m{z-index:100}
.mini{width:100%}
.mini td,.mini th{height:40px;padding:0 10px;position:static;font-size:13px}
.mini th{font-size:11.5px;height:34px}
.mini td.num,.mini th.num{text-align:right}
.mini tr.total td{font-weight:600;border-top:1px solid var(--text)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border);counter-increment:s}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;border:1px solid #C9CCD1;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.steps .eq{font-size:12px;color:var(--muted);margin-top:2px}
.steps .res{font-weight:600;white-space:nowrap}
.steps li.final .res{font-size:16px}
.recon{margin-top:10px;font-size:12.5px;padding:8px 12px;border-radius:7px;background:#F2F9F5;border:1px solid #CFE9DA}
.recon.bad{background:#FDF1F1;border-color:#F4CFD0}
.sumrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.sumrow div{border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.sumrow .l{font-size:11.5px;color:var(--muted)}
.sumrow .v{font-size:18px;font-weight:600;display:flex;align-items:center;margin-top:2px}
.chk{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px}
.dot.pass{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.fail{background:var(--err)}
.chk .t{font-weight:600;font-size:13px}.chk .d{font-size:13px}.chk .f{font-size:12px;color:var(--muted);margin-top:2px}
/* scenario */
.scen{display:grid;grid-template-columns:360px 1fr;gap:28px;align-items:start}
input[type=range]{width:100%;accent-color:#0A0A0A}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:2px}
.warnbox{border:1px solid #F1DFB8;background:#FFF8EA;border-left:4px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:13px;margin-top:12px}
.okbox{border:1px solid var(--border);background:#fff;border-left:4px solid var(--ok);border-radius:8px;padding:10px 14px;font-size:13px;margin-top:12px}
.delta-pos{color:var(--ok);font-weight:600}.delta-neg{color:var(--err);font-weight:600}
/* conflict */
.defs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.def{border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:13px}
.def .who{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.def .cnt{font-size:20px;font-weight:600;margin:4px 0}
.def.gov{border-color:var(--text);background:#FCFCFC}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.popover{position:fixed;left:50%;top:96px;transform:translateX(-50%);width:560px;background:#fff;border-radius:12px;z-index:110;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:22px 24px}
.popover ul{margin:8px 0 0 18px;padding:0}.popover li{margin-bottom:4px}
.leak{display:flex;gap:12px;align-items:center;border-left:4px solid var(--warn);background:#fff;border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;padding:12px 16px;margin-top:16px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:6px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.cap{font-size:12px;color:var(--muted)}
.sr{position:absolute;left:-9999px}
</style>
</head>

<script>

/* ============ SAMPLE DATASET (fictional). Everything on screen is computed from this. ============ */
const GM = 0.75;               // gross margin assumption
const MARG = 1.25;             // scenario: added Broker dollars buy customers at 1.25x today's Broker CAC
const DQ = { brokerBlank:38, missingSource:14, stale:22, dupes:17, financeVarianceUsd:42000 };

 {id:"broker", name:"Broker", leads:520,Q:240,K:120,W:60,L:130,onb:56,ret:47,exp:6, acv:6000, medQuote:6,

 {id:"direct", name:"Direct sales", leads:900,Q:260,K:80,W:28,L:100,onb:27,ret:23,exp:5, acv:24000, medQuote:4,

const STAGES = [["leads","Lead","leads"],["Q","Qualified","qualified"],["K","Quote","quotes"],["W","Close","winrate"],["onb","Onboarded","retention12"],["ret","Retained 12m","retention12"],["exp","Expanded","retention12"]];

 {who:"Marketing",txt:"Lead score of 50 or more",n:1140},
 {who:"Sales",txt:"Rep accepted the opportunity",n:902},
 {who:"Finance",txt:"Budget confirmed and quote requested",n:655}];

const LEGACY_COUNT = 902;                        // the Sales definition currently on the dashboards

/* ============ METRIC DICTIONARY ============ */
const METRICS = {
 cac:{name:"CAC (customer acquisition cost)",def:"What we spend to win one new customer through a channel. Onboarding cost is not included.",formula:"(Sales + Marketing spend attributed to channel in period) ÷ new customers from channel",src:["Salesforce Opportunity","Salesforce Account","Finance ledger (spend)","Headcount allocation sheet"],model:"fct_channel_economics",dash:["Channel economics","Overview","Scenario slider"],owner:"RevOps",rev:"Sep 24, 2026",issues:"38% of broker deals have no broker named, so broker spend cannot be matched to customers. Headcount time is an estimate.",ch:true},

const TI = {

function econ(seg,geo){
  const sg = seg?SEG[seg]:{cnt:1,sp:1,acv:1}, go = geo?GEO[geo]:{cnt:1,sp:1};
  const cs = sg.cnt*go.cnt, ss = sg.sp*go.sp;
  const rows = CH.map(c=>{
    const sc = v=>Math.max(1,Math.round(v*cs));
    const leads=sc(c.leads), Q=sc(c.Q), K=Math.min(sc(c.K),Q), W=Math.min(sc(c.W),K);
    const L=Math.max(0,Math.min(sc(c.L),Q-W));
    const onb=Math.min(sc(c.onb),W), ret=Math.min(sc(c.ret),onb), exp=Math.min(sc(c.exp),ret);
    const lines=c.lines.map(l=> l.k==="s" ? {label:l.label,basis:"Spend line",amt:Math.round(l.amt*ss)}
      : {label:l.label+" (time allocated)",basis:(l.fte*ss).toFixed(2)+" FTE × "+money(l.rate)+" per quarter",amt:Math.round(l.fte*ss*l.rate)});
    const spend=lines.reduce((a,l)=>a+l.amt,0), acv=Math.round(c.acv*sg.acv), arr=W*acv;
    const gp=acv/12*GM;
    return {id:c.id,name:c.name,leads,Q,K,W,L,onb,ret,exp,lines,spend,N:W,acv,arr,gp,cac:spend/W,payback:(spend/W)/gp,
      winrate:W/(W+L),conv:W/Q,qc:W/K,medQuote:c.medQuote,days:c.days};
  });
  const T = rows.reduce((a,r)=>({spend:a.spend+r.spend,N:a.N+r.N,arr:a.arr+r.arr,W:a.W+r.W,L:a.L+r.L,Q:a.Q+r.Q}),{spend:0,N:0,arr:0,W:0,L:0,Q:0});
  T.cac=T.spend/T.N; T.payback=T.spend/(T.arr/12*GM); T.winrate=T.W/(T.W+T.L); T.conv=T.W/T.Q;
  return {rows,T};
}

const RANK = {A:0,B:1,C:2};
const worst = gs => gs.reduce((a,g)=>RANK[g]>RANK[a]?g:a,"A");
function trustFor(id,ch){
  let t;
  if(TI[id]){ t = TI[id][ch||"broker"]; }
  else t = SINGLE[id];
  let [comp,fresh,recon] = t, def="ok";
  if(recon==="fin") recon = FIN_VAR;
  if(id==="qualified") def = S.adopted?"ok":"hard";
  if(id==="conv") def = S.adopted?"ok":"soft";
  if(id==="qualified" && S.adopted) comp = 93;
  const checks=[];
  checks.push({key:"comp",label:"Completeness",val:comp,status:comp>=90?"pass":comp>=70?"warn":"fail"});
  checks.push({key:"fresh",label:"Freshness",val:fresh,status:fresh<=1?"pass":fresh<=3?"warn":"fail"});
  if(recon!=null) checks.push({key:"recon",label:"Reconciles with Finance",val:recon,status:recon<=2?"pass":recon<=5?"warn":"fail"});
  checks.push({key:"def",label:"One governed definition",val:def,status:def==="ok"?"pass":def==="soft"?"warn":"fail"});
  const score = Math.round(.5*comp + .25*Math.max(0,100-fresh*10) + .25*(recon==null?100:Math.max(0,100-recon*10)));
  const hasFail=checks.some(c=>c.status==="fail"), hasWarn=checks.some(c=>c.status==="warn");
  const grade = hasFail?"C":(hasWarn||score<85)?"B":"A";
  return {id,ch,checks,score,grade,recon};
}
function metricGrade(id){
  if(TI[id]) return worst(CH.map(c=>trustFor(id,c.id).grade));
  return trustFor(id).grade;
}

}

  </div>

function lineageSVG(id){
  const m=METRICS[id], cols=[["Source",m.src],["Warehouse model",["stg_salesforce","stg_finance_ledger",m.model].filter((x,i)=>i===2||m.src.some(s=>i===0?s.startsWith("Salesforce"):s.startsWith("Finance")||s.startsWith("Billing")||s.startsWith("Headcount")||s.startsWith("Plan")))],["Metric",[m.name]],["Used in",m.dash]];
  const cw=150,gap=32,nh=34,sp=46,top=30, n=Math.max(...cols.map(c=>c[1].length)), H=top+n*sp+6, W=cols.length*cw+(cols.length-1)*gap;
  const pos=cols.map((c,ci)=>c[1].map((t,i)=>({x:ci*(cw+gap),y:top+(i+(n-c[1].length)/2)*sp,t})));
  let edges="";
  for(let ci=0;ci<3;ci++) pos[ci].forEach(a=>pos[ci+1].forEach(b=>{edges+=`<path d="M${a.x+cw},${a.y+nh/2} C${a.x+cw+gap/2},${a.y+nh/2} ${b.x-gap/2},${b.y+nh/2} ${b.x},${b.y+nh/2}" fill="none" stroke="#B9BCC1" stroke-width="1.2" marker-end="url(#ar)"/>`;}));
  const nodes=pos.map((col,ci)=>col.map(p=>{const t=p.t.length>22?p.t.slice(0,21)+"…":p.t;
    const fill=ci===2?"#0A0A0A":"#fff",tc=ci===2?"#fff":"#0A0A0A";
    return `<g><title>${esc(p.t)}</title><rect x="${p.x}" y="${p.y}" width="${cw}" height="${nh}" rx="6" fill="${fill}" stroke="#C9CCD1"/><text x="${p.x+10}" y="${p.y+21}" font-size="11.5" fill="${tc}">${esc(t)}</text></g>`;}).join("")).join("");
  const heads=cols.map((c,ci)=>`<text x="${ci*(cw+gap)}" y="14" font-size="11" fill="#6B6F76" font-weight="600">${c[0]}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Lineage for ${esc(m.name)}: sources to warehouse model to metric to dashboards"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B9BCC1"/></marker></defs>${heads}${edges}${nodes}</svg>`;
}

  <p style="margin-bottom:0"><b>About the builder</b></p><ul>
  <li>2 years as owner/admin of a Salesforce org: flows, permission sets, reports and dashboards, Data Loader migrations, dedupe.</li>
  <li>Led HubSpot-to-Salesforce migrations; about 3 years in RevOps.</li>
  <li>Previously GTM Engineer at Cortex, building agent workflows.</li>
  <li>Built LangChain agents at Ignyte for forecasting and lead qualification (30% improvement).</li>
  <li>Stack: Clay, HubSpot, Salesforce, Gong, Trigger.dev, LangChain/CrewAI, Smartlead, Neon, Vercel.</li></ul>
  <p style="margin-bottom:0"><b>Boundary:</b> the board defines requirements; RevOps and Engineering own the build.</p></div>`);
  closeLayer.back=document.activeElement; $("#about .iconbtn").focus();
}

/* ============ ROUTER / EVENTS ============ */
const VIEWS={overview:viewOverview,channels:viewChannels,funnel:viewFunnel,dictionary:viewDictionary,quality:viewQuality,forecast:viewForecast};
function render(keepScroll){
  const y=window.scrollY;
  document.body.classList.toggle("trusted-only",S.trustedOnly);
  renderTabs(); $("#main").innerHTML=VIEWS[S.screen]();
  if(S.screen==="channels") renderScenario();
  if(keepScroll) window.scrollTo(0,y);
}
function go(screen,keep){ S.screen=screen; if(location.hash!=="#"+screen) history.replaceState(null,"","#"+screen); render(keep); if(!keep) window.scrollTo(0,0); }
document.addEventListener("click",e=>{
  const tr=e.target.closest("[data-trust]"); if(tr){e.stopPropagation(); openTrust(tr.dataset.trust,tr.dataset.ch); return;}
  const ml=e.target.closest("[data-metric]"); if(ml){e.preventDefault(); closeLayer.back=null; closeLayer(); if(S.screen!=="dictionary"){S.screen="dictionary";history.replaceState(null,"","#dictionary");render();window.scrollTo(0,0);} openMetric(ml.dataset.metric); return;}
  const a=e.target.closest("[data-act]"); if(!a) return;
  switch(a.dataset.act){
   case "nav": closeLayer(); go(a.dataset.screen); break;
   case "toggle-trusted": S.trustedOnly=!S.trustedOnly; render(true); break;
   case "chip": S[a.dataset.grp]= S[a.dataset.grp]===a.dataset.val?null:a.dataset.val; render(true); break;
   case "open-channel": openChannel(a.dataset.id); break;
   case "open-metric": openMetric(a.dataset.id); break;
   case "close-layer": closeLayer(); break;
   case "about": openAbout(); break;
   case "goto-scenario": go("channels"); setTimeout(()=>$("#scenario-card").scrollIntoView({block:"start"}),0); break;
   case "to-conflict": closeLayer(); go("dictionary"); break;
   case "adopt": {
     if(S.adopted) break;
     S.adopted=true; S.adoptedAt=nowCT();
     S.log.unshift({t:S.adoptedAt,what:`Adopted governed definition of Qualified. Qualified opportunities KPI changed from ${num(LEGACY_COUNT)} to ${num(GOV_COUNT)}; trust moved from C to ${gOf("qualified")}.`,by:"Head of Revenue Strategy & Ops (demo)"});
     closeLayer(); render(true); toast(`Qualified opportunities now ${num(GOV_COUNT)} (was ${num(LEGACY_COUNT)}). Change logged.`); break; }
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#layer").innerHTML){closeLayer();return;}
  if((e.key==="Enter"||e.key===" ")&&(e.target.matches("tr.row")||e.target.matches("a.mlink"))){e.preventDefault();e.target.click();}
});
document.addEventListener("input",e=>{ if(e.target.id==="shift"){S.shift=+e.target.value;$("#shiftv").textContent=S.shift+"%";renderScenario();} });
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(VIEWS[h]&&h!==S.screen){S.screen=h;render();}});
(function init(){const h=location.hash.slice(1); if(VIEWS[h]) S.screen=h; render();})();
</script>
</body>
